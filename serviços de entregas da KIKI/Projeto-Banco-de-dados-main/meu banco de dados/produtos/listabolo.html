<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bolos - Café com Gatinhos</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>

        <h1>Café com Gatinhos</h1>

        <input
            type="search"
            placeholder="pesquisar produtos"
        >

        <button>🔎</button>
        <button>🛒</button>
        <button>👤</button>

    </header>


    <!-- Corações do fundo -->

    <div class="coracoes">

        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>

    </div>


    <main>

        <h2 class="titulo-categoria">
            🍰 Nossos Bolos
        </h2>


        <section class="produtos-categoria">


            <!-- BOLO DE CHOCOLATE -->

            <article class="card-categoria">

                <h3>Bolo de Chocolate</h3>

                <img
                    src="../bolo_chocolate.jpeg"
                    alt="Bolo de chocolate"
                >

                <p>
                    Bolo de chocolate delicioso.
                </p>

                <p>
                    R$ 5,00
                </p>

                <button
                    onclick="location.href='BoloChocolate.html'"
                >
                    Ver produto
                </button>

            </article>


            <!-- BOLO DE MORANGO -->

            <article class="card-categoria">

                <h3>Bolo de Morango</h3>

                <img
                    src="../bolo_morango.jpeg"
                    alt="Bolo de morango"
                >

                <p>
                    Bolo macio com sabor de morango.
                </p>

                <p>
                    R$ 5,00
                </p>

                <button
                    onclick="location.href='BoloMorango.html'"
                >
                    Ver produto
                </button>

            </article>


            <!-- BOLO DE CENOURA -->

            <article class="card-categoria">

                <h3>Bolo de Cenoura</h3>

                <img
                    src="../bolo_cenoura.jpeg"
                    alt="Bolo de cenoura"
                >

                <p>
                    Bolo de cenoura com cobertura.
                </p>

                <p>
                    R$ 5,00
                </p>

                <button
                    onclick="location.href='BoloCenoura.html'"
                >
                    Ver produto
                </button>

            </article>


        </section>

    </main>


    <footer>

        <p>
            Obrigada por escolher nosso café 🐈☕

        </p>

    </footer>

</body>

</html>
