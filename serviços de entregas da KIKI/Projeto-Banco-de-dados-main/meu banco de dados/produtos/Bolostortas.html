<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bolos e Tortas - Café com Gatinhos</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>

        <h1>Café com Gatinhos</h1>

        <input
            type="search"
            placeholder="pesquisar produtos"
        >

        <button>🔎</button>
        <button>🛒</button>
        <button>👤</button>

    </header>


    <!-- Corações do fundo -->

    <div class="coracoes">

        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>

    </div>


    <main>

        <h2 class="titulo-categoria">
            🍰 Bolos e Tortas 🥧
        </h2>


        <section class="produtos-categoria">


            <!-- LISTA DE BOLOS -->

            <article class="card-categoria">

                <h3>🍰 Bolos</h3>

                <img
                    src="../baixados (15).jpeg"
                    alt="Bolos"
                >

                <p>
                    Escolha entre vários sabores
                    de bolo.
                </p>

                <button
                    onclick="location.href='listabolo.html'"
                >
                    Ver bolos
                </button>

            </article>


            <!-- LISTA DE TORTAS -->

            <article class="card-categoria">

                <h3>🥧 Tortas</h3>

                <img
                    src="../baixados (16).jpeg"
                    alt="Tortas"
                >

                <p>
                    Confira nossas deliciosas
                    opções de tortas.
                </p>

                <button
                    onclick="location.href='listatortas.html'"
                >
                    Ver tortas
                </button>

            </article>


        </section>

    </main>


    <footer>

        <p>
            Obrigada por escolher nosso café 🐈☕
        </p>

    </footer>

</body>

</html>
