<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tortas - Café com Gatinhos</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>

        <h1>Café com Gatinhos</h1>

        <input
            type="search"
            placeholder="pesquisar produtos"
        >

        <button>🔎</button>
        <button>🛒</button>
        <button>👤</button>

    </header>


    <!-- Corações do fundo -->

    <div class="coracoes">

        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>

    </div>


    <main>

        <h2 class="titulo-categoria">
            🥧 Nossas Tortas
        </h2>


        <section class="produtos-categoria">


            <!-- TORTA DE MORANGO -->

            <article class="card-categoria">

                <h3>Torta de Morango</h3>

                <img
                    src="../torta_morango.jpeg"
                    alt="Torta de morango"
                >

                <p>
                    Torta cremosa com morangos.
                </p>

                <p>
                    R$ 5,00
                </p>

                <button
                    onclick="location.href='TortaMorango.html'"
                >
                    Ver produto
                </button>

            </article>


            <!-- TORTA DE LIMÃO -->

            <article class="card-categoria">

                <h3>Torta de Limão</h3>

                <img
                    src="../torta_limao.jpeg"
                    alt="Torta de limão"
                >

                <p>
                    Torta refrescante de limão.
                </p>

                <p>
                    R$ 5,00
                </p>

                <button
                    onclick="location.href='TortaLimao.html'"
                >
                    Ver produto
                </button>

            </article>


            <!-- TORTA DE CHOCOLATE -->

            <article class="card-categoria">

                <h3>Torta de Chocolate</h3>

                <img
                    src="../torta_chocolate.jpeg"
                    alt="Torta de chocolate"
                >

                <p>
                    Torta cremosa de chocolate.
                </p>

                <p>
                    R$ 5,00
                </p>

                <button
                    onclick="location.href='TortaChocolate.html'"
                >
                    Ver produto
                </button>

            </article>


        </section>

    </main>


    <footer>

        <p>
            Obrigada por escolher nosso café 🐈☕

        </p>

    </footer>

</body>

</html>
